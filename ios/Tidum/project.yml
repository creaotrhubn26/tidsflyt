# ios/Tidum/project.yml
name: Tidum
options:
  bundleIdPrefix: no.tidum
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  Tidum:
    type: application
    platform: iOS
    sources: [Tidum]
    info:
      path: Tidum/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLSchemes: [tidum]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.tidum.app
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
  TidumTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TidumTests]
    dependencies:
      - target: Tidum
  TidumUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TidumUITests]
    dependencies:
      - target: Tidum
schemes:
  Tidum:
    build:
      targets:
        Tidum: all
    test:
      targets: [TidumTests, TidumUITests]
